<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Entry App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="section">
    <h1>Item Entry</h1>
    
    <div id="items-container">
      <!-- Items will be added by JavaScript -->
    </div>
    
    <button id="add-item-btn">Add New Item</button>
  </div>

  <hr class="separator">

  <div class="section">
    <h1>People Entry</h1>
    
    <div id="people-container">
      <!-- People will be added by JavaScript -->
    </div>
    
    <button id="add-person-btn">Add New Person</button>
  </div>

  <hr class="separator">

  <div class="section">
    <h1>Payment Summary</h1>
    
    <button id="calculate-btn">Calculate Totals</button>
    
    <div id="summary-container">
      <!-- Summary will be added by JavaScript -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
